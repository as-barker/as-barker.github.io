<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../style.css"><style>:root{--c:#8E3324}</style></head>
<body data-up="../../" data-colour="#8E3324"><div class="w"><nav class="crumb"><a href="../../index.html">AB</a><span class="sep">/</span><a href="../../training/">Training</a><span class="sep">/</span><span id="here"></span></nav>
<h1 class="doc" id="title">&nbsp;</h1><p class="standfirst lede" id="lede"></p><ul class="ix" id="index"><li class="loading">Loading&hellip;</li></ul>
<footer><a href="mailto:ab@abarker.org">ab@abarker.org</a></footer>
</div><script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UP = document.body.dataset.up;
async function render(){
  let d;
  try {
    const r = await fetch(UP + 'pages.json');
    if(!r.ok) throw new Error(r.status);
    d = (await r.json()).vent;
  } catch(e){
    document.getElementById('index').innerHTML =
      '<p class="loadfail">Could not load this page. The text is in '
      + '<a href="' + UP + 'pages.json">pages.json</a>.</p>';
    return;
  }
  document.getElementById('title').textContent = d.heading;
  document.getElementById('here').textContent = d.heading;
  document.title = d.heading + ' · AB';
  document.getElementById('lede').textContent = d.lede;
  document.getElementById('index').innerHTML = d.sections.map(s =>
    `<li style="--tc:#8E3324"><a href="${esc(s.href)}">`
    + `<span class="tag">${esc(s.title)}</span><p>${esc(s.description)}</p>`
    + `<div class="meta">${s.meta}</div></a></li>`).join('');
}
render();
</script>
</body></html>
