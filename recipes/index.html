<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes · AB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"><style>:root{--c:#48592A}</style></head>
<body><div class="w"><nav class="crumb"><a href="../index.html">AB</a><span class="sep">/</span><span>Recipes</span></nav>
<h1 class="doc">Recipes</h1><p class="standfirst lede">Imperial with grams alongside, macros at the bottom. Ingredients sit in their own panel so you can weigh everything out before you start.</p><ul class="ix" id="index"><li class="loading">Loading&hellip;</li></ul>
<footer><a href="mailto:ab@abarker.org">ab@abarker.org</a></footer>
</div><script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function render(){
  const el = document.getElementById('index');
  try {
    const r = await fetch('recipes.json');
    if(!r.ok) throw new Error(r.status);
    const rs = await r.json();
    el.innerHTML = rs.map(x =>
      `<li style="--tc:#48592A"><a href="${esc(x.slug)}/">`
      + `<span class="tag">${esc(x.title)}</span>`
      + `<p>${esc(x.blurb)}</p>`
      + `<div class="meta"><b>${esc(x.serves)}</b></div></a></li>`).join('');
  } catch(e){
    el.innerHTML = '<p class="loadfail">Could not load the recipes. '
      + 'The data is in <a href="recipes.json">recipes.json</a>.</p>';
  }
}
render();
</script>
</body></html>
