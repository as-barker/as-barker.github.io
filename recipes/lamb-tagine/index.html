<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe · AB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../style.css"><style>:root{--c:#48592A}</style></head>
<body data-slug="lamb-tagine"><div class="w"><nav class="crumb"><a href="../../index.html">AB</a><span class="sep">/</span><a href="../../recipes/">Recipes</a><span class="sep">/</span><span id="here"></span></nav>
<h1 class="doc" id="title">&nbsp;</h1><p class="standfirst" id="blurb"></p><div class="control"><span class="live" id="serves"></span></div><div class="recipe" id="recipe"><p class="loading">Loading&hellip;</p></div>
<footer><a href="mailto:ab@abarker.org">ab@abarker.org</a></footer>
</div><script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SLUG = document.body.dataset.slug;
async function render(){
  const el = document.getElementById('recipe');
  let r;
  try {
    const res = await fetch('../recipes.json');
    if(!res.ok) throw new Error(res.status);
    const all = await res.json();
    r = all.find(x => x.slug === SLUG);
    if(!r) throw new Error('not found');
  } catch(e){
    el.innerHTML = '<p class="loadfail">Could not load this recipe. '
      + 'The data is in <a href="../recipes.json">recipes.json</a>.</p>';
    return;
  }
  document.title = r.title + ' \u00b7 AB';
  document.getElementById('title').textContent = r.title;
  document.getElementById('blurb').textContent = r.blurb;
  document.getElementById('serves').textContent = r.serves;
  document.getElementById('here').textContent = r.title;

  const ing = r.ingredients.map(i => {
    const amt = i.imperial ? esc(i.imperial) + ' ' : '';
    const g = i.grams ? ` <span class="g">(${esc(i.grams)})</span>` : '';
    return `<li>${amt}${esc(i.name)}${g}</li>`;
  }).join('');
  const steps = r.steps.map(s => `<li>${s}</li>`).join('');
  const mac = r.macros.map(m => `<tr><td>${esc(m.label)}</td><td>${esc(m.value)}</td></tr>`).join('');

  el.innerHTML =
    `<aside class="ing"><h2>Ingredients</h2><ul>${ing}</ul></aside>`
  + `<div class="method"><ol>${steps}</ol>`
  + `<div class="macros"><p class="tbl-label">Macros</p>`
  + `<table><tbody>${mac}</tbody></table>`
  + `<p class="tbl-note">${esc(r.note)}</p></div></div>`;
}
render();
</script>
</body></html>
